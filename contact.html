  <main class="container narrow">

    <section class="card">
      <h1>Contact Me</h1>
      <p class="lead">Have a question or want to say hello? Fill in the form below.</p>

      <form id="contactForm">
        <div class="field">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Your full name">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="text" id="email" placeholder="name@example.com">
        </div>

        <div class="field">
          <label for="country">Country</label>
          <input type="text" id="country" placeholder="Your country">
        </div>

        <div class="field">
          <label for="comments">Comments</label>
          <textarea id="comments" rows="5" placeholder="Write your comments here"></textarea>
        </div>

        <button type="submit">Submit</button>
      </form>
    </section>

  </main>
